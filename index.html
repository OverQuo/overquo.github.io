<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OverQuo LLC — Building better tech for New Yorkers</title>
  <meta name="description" content="OverQuo builds technology that makes life better for New Yorkers in co-ops, condos, and rentals. LaundryIQ and BuildingIQ coming soon." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwindcss.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              orange: '#F5A623',
              cyan: '#33BBEF',
            },
          },
          fontFamily: {
            heading: ['Montserrat', 'sans-serif'],
            body: ['Open Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Open Sans', sans-serif; margin: 0; }

    .parallax-hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Background image layer */
    .parallax-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url('https://images.unsplash.com/photo-1534430480872-3498386e7856?auto=format&fit=crop&w=2000&q=80');
      background-attachment: fixed;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    /* Orange tint overlay — subtle duotone */
    .parallax-hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(17, 17, 17, 0.4) 0%,
        rgba(17, 17, 17, 0.3) 30%,
        rgba(17, 17, 17, 0.7) 100%
      );
      mix-blend-mode: normal;
    }

    /* Duotone color filter on the image */
    .parallax-hero::before {
      filter: sepia(0.4) saturate(1.8) hue-rotate(-15deg) brightness(0.7);
    }

    @supports (-webkit-touch-callout: none) {
      .parallax-hero::before {
        background-attachment: scroll;
      }
    }

    /* Accent color on "Building" */
    .accent-text {
      color: #33BBEF;
    }

    /* Transparent button style */
    .btn-ghost {
      display: inline-block;
      border: 2px solid rgba(255,255,255,0.9);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: none;
      text-decoration: none;
      transition: all 0.3s ease;
      backdrop-filter: blur(4px);
      background: rgba(0,0,0,0.3);
    }
    .btn-ghost:hover {
      background: rgba(0,0,0,0.5);
      border-color: #fff;
      transform: translateY(-2px);
    }

    /* Fade-in animation */
    .fade-up {
      opacity: 0;
      transform: translateY(24px);
      animation: fadeUp 1s ease-out forwards;
    }
    .fade-up-delay-1 { animation-delay: 0.2s; }
    .fade-up-delay-2 { animation-delay: 0.4s; }
    .fade-up-delay-3 { animation-delay: 0.7s; }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body class="bg-[#111] text-gray-200 antialiased">

  <section class="parallax-hero">
    <div class="relative z-10 max-w-4xl mx-auto px-6 text-center">
      <img src="overquo.png" alt="OverQuo" class="h-16 sm:h-20 md:h-24 mx-auto mb-10 fade-up" />
      <h1 class="font-heading font-extrabold text-4xl sm:text-5xl md:text-6xl leading-tight text-white mb-6 fade-up fade-up-delay-1">
        Building tools that make life<br class="hidden sm:block" />
        better for New Yorkers
      </h1>
      <p class="text-lg sm:text-xl text-white max-w-2xl mx-auto mb-12 leading-relaxed fade-up fade-up-delay-2" style="text-shadow: 0 1px 8px rgba(0,0,0,0.6);">
        Technology for co-ops, condos, and rentals — designed by someone who lives it.
      </p>
      <div class="flex flex-col sm:flex-row items-center justify-center gap-4 sm:gap-6 fade-up fade-up-delay-3">
        <a href="https://www.laundryiq.io" class="btn-ghost">LaundryIQ</a>
        <a href="https://www.buildingiq.nyc" class="btn-ghost">BuildingIQ</a>
      </div>
    </div>
  </section>

</body>
</html>
